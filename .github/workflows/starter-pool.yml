name: Starter pool
# Refreshes the bundled outage/offline cards in public/data/starter/ each week.
# A thin or failed fetch fails the job and keeps the current pool.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wikiscroll-starter-pool
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          # pnpm is installed in a later step.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the pool
        run: node scripts/build-starter.mjs
      - name: Test suite
        run: pnpm test
      - name: Commit the new pool
        run: |
          git add public/data/starter
          if git diff --cached --quiet; then echo "Pool unchanged."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh starter pool'
          # The build takes about half an hour, so main often moves meanwhile.
          # Replay the pool on top of it and test again before each push.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
            pnpm test
          done
          exit 1
